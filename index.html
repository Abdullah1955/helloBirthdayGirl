<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imaan Fatima</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap">
<style>
:root { --night: #0d0a1c; --night-2: #1c1233; --ink: #f3ece6; --muted: #a99db8; --gold: #e9c98f; --gold-soft: rgba(233,201,143,.55); --rose: #ff8fb4; --line: rgba(233,201,143,.3); color-scheme: dark; }
html { background: var(--night); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(120% 80% at 50% 0%, var(--night-2) 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink); font-family: "Cormorant Garamond", Georgia, serif; overflow: hidden; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.gate { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; padding: 32px 16px; text-align: center; }
.lock { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line);
  background: rgba(255,255,255,.04); box-shadow: 0 0 30px rgba(255,143,180,.18); color: var(--rose); font-size: 1.5rem; }
.label { font-family: "Jost", Arial, sans-serif; font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
h1 { margin: 0; font-family: "Great Vibes", cursive; font-weight: 400; font-size: clamp(2.6rem, 11vw, 3.8rem); line-height: 1.1;
  text-shadow: 0 0 18px rgba(255,143,180,.5), 0 0 44px rgba(224,80,127,.3); }
.lead { margin: 0; color: var(--muted); font-style: italic; font-size: 1.15rem; max-width: 30ch; }
form { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 8px; }
.digits { display: flex; gap: 12px; }
.digits input { width: 56px; height: 66px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.05); color: var(--ink); text-align: center; font-family: "Jost", Arial, sans-serif; font-size: 1.6rem;
  caret-color: var(--rose); outline: none; transition: border-color .2s, box-shadow .2s, background .2s; -webkit-text-security: disc; }
.digits input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(233,201,143,.18); background: rgba(255,255,255,.08); }
.digits.bad { animation: shake .45s ease; }
.digits.bad input { border-color: #ff7a9c; }
.digits.ok input { border-color: var(--gold); background: rgba(233,201,143,.15); }
.btn { font-family: "Jost", Arial, sans-serif; font-size: .8rem; letter-spacing: .22em; text-transform: uppercase; border-radius: 999px;
  padding: 13px 34px; cursor: pointer; background: var(--gold); color: var(--night); border: 1px solid var(--gold); transition: background .2s, opacity .2s; }
.btn:hover { background: #f3d9a8; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.msg { min-height: 1.5em; margin: 0; font-style: italic; color: var(--rose); font-size: 1.05rem; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
@media (max-width: 360px) { .digits { gap: 8px; } .digits input { width: 50px; height: 60px; } }
@media (prefers-reduced-motion: reduce) { .digits.bad { animation: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="gate">
  <div class="lock" aria-hidden="true">&#9829;</div>
  <span class="label">For Imaan Fatima</span>
  <h1>Enter our secret code</h1>
  <p class="lead">Only you would know it.</p>
  <form id="f" autocomplete="off">
    <div class="digits" id="digits" role="group" aria-label="4 digit secret code">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1" autofocus>
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
      <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
    </div>
    <button class="btn" id="go" type="submit">Unlock</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

  const SALT = "tYNXm6O+pVryqmpxkn5hcw==", IV = "ETEFxp8i2iWdP/Hi", ITER = 600000;
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const boxes = [...document.querySelectorAll(".digits input")];
  const digits = document.getElementById("digits"), msg = document.getElementById("msg"), go = document.getElementById("go");
  const wrong = ["That's not it. Try again.", "Hmm, not quite.", "Think of us…", "Almost. One more try."];
  let tries = 0, busy = false;

  const code = () => boxes.map(b => b.value).join("");
  boxes.forEach((b, i) => {
    b.addEventListener("input", () => {
      b.value = b.value.replace(/\D/g, "").slice(-1);
      digits.classList.remove("bad"); msg.textContent = "";
      if (b.value && i < 3) boxes[i + 1].focus();
      if (code().length === 4) unlock();
    });
    b.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !b.value && i > 0) { boxes[i - 1].focus(); boxes[i - 1].value = ""; e.preventDefault(); }
      if (e.key === "ArrowLeft" && i > 0) boxes[i - 1].focus();
      if (e.key === "ArrowRight" && i < 3) boxes[i + 1].focus();
    });
    b.addEventListener("paste", e => {
      const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
      if (!t) return; e.preventDefault();
      [...t].forEach((d, j) => { if (boxes[j]) boxes[j].value = d; });
      boxes[Math.min(t.length, 3)].focus();
      if (code().length === 4) unlock();
    });
  });
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); unlock(); });

  async function unlock() {
    if (busy) return;
    const c = code();
    if (c.length < 4) { msg.textContent = "Enter all four digits."; return; }
    if (!(window.crypto && crypto.subtle)) { msg.textContent = "Please open this link in a normal browser (https)."; return; }
    busy = true; go.disabled = true; msg.textContent = "";
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(c), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(PAYLOAD));
      const html = new TextDecoder().decode(plain);
      digits.classList.add("ok"); msg.style.color = "var(--gold)"; msg.textContent = "Welcome ♥";
      setTimeout(() => { document.open(); document.write(html); document.close(); }, 650);
    } catch (err) {
      busy = false; go.disabled = false;
      msg.textContent = wrong[tries++ % wrong.length];
      digits.classList.remove("bad"); void digits.offsetWidth; digits.classList.add("bad");
      setTimeout(() => { boxes.forEach(b => b.value = ""); boxes[0].focus(); }, 450);
    }
  }

  // quiet stars
  const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2); let W, H, stars = [];
  function size() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28, s: .01 + Math.random() * .03 })); }
  function frame() { ctx.clearRect(0, 0, W, H);
    for (const s of stars) { s.p += s.s; ctx.globalAlpha = .35 + .65 * Math.abs(Math.sin(s.p)); ctx.fillStyle = "#fff4e0"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill(); }

  size(); frame(); addEventListener("resize", size);
